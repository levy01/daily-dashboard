<!DOCTYPE html>
<html lang="en" class="h-full bg-slate-950 text-slate-100">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Gym Dashboard">
  <title>Gym & Work Dashboard</title>

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- FontAwesome Icons CDN -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <style>
    @font-face {
      font-family: 'Digital';
      src: url('https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/webfonts/fa-solid-900.woff2') format('woff2');
    }
    .digital-font {
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace;
      letter-spacing: -0.02em;
    }
    /* Prevent selection on tap/hold for iOS kiosk buttons */
    .no-select {
      -webkit-touch-callout: none;
      -webkit-user-select: none;
      user-select: none;
    }
  </style>
</head>
<body class="h-full flex flex-col justify-between overflow-hidden bg-slate-950 font-sans antialiased no-select">

  <!-- Top Header / Navigation Bar -->
  <header class="flex items-center justify-between px-6 py-3 border-b border-slate-800 bg-slate-900/40">
    
    <!-- Mode Selector: Sliding Switch Button -->
    <div class="flex items-center space-x-3">
      <div class="relative bg-slate-900 border border-slate-800 p-1 rounded-xl flex items-center w-80 h-11 cursor-pointer select-none" onclick="toggleModeFromSwitch(event)">
        <!-- Sliding Indicator Background -->
        <div id="switchPill" class="absolute top-1 bottom-1 w-[calc(50%-4px)] bg-amber-500/20 border border-amber-500/40 rounded-lg transition-all duration-300 ease-in-out left-1"></div>

        <!-- Mode Option 1: Gym Wall Clock -->
        <div id="modeOptClock" class="relative z-10 w-1/2 text-center text-xs font-bold uppercase tracking-wider text-amber-400 transition-colors"
             onmousedown="handlePressStart('clock')" onmouseup="handlePressEnd()" onmouseleave="handlePressEnd()"
             ontouchstart="handlePressStart('clock')" ontouchend="handlePressEnd()" ondblclick="promptRenameLabel('clock')">
          <span id="labelClock">Gym Wall Clock</span>
        </div>

        <!-- Mode Option 2: Dead Hang Timer -->
        <div id="modeOptTimer" class="relative z-10 w-1/2 text-center text-xs font-bold uppercase tracking-wider text-slate-400 transition-colors"
             onmousedown="handlePressStart('timer')" onmouseup="handlePressEnd()" onmouseleave="handlePressEnd()"
             ontouchstart="handlePressStart('timer')" ontouchend="handlePressEnd()" ondblclick="promptRenameLabel('timer')">
          <span id="labelTimer">Dead Hang Timer</span>
        </div>
      </div>
    </div>

    <!-- Right Header Controls: Local Weather & Gist Task Fetch Drawer -->
    <div class="flex items-center space-x-4">
      
      <!-- Local Weather Badge -->
      <div id="weatherBadge" class="flex items-center space-x-3 bg-slate-900/80 border border-slate-800 rounded-xl px-4 py-2 text-xs font-medium">
        <i id="weatherIcon" class="fa-solid fa-sun text-amber-400 text-lg animate-pulse"></i>
        <div class="flex items-center space-x-2">
          <span id="weatherTemp" class="text-slate-100 font-bold text-sm">--°F</span>
          <span id="weatherRange" class="text-slate-400 text-[11px]">H: --° L: --°</span>
        </div>
        <span class="text-slate-700">|</span>
        <span id="weatherCity" class="text-slate-400 font-normal truncate max-w-[120px]"><i class="fa-solid fa-location-dot text-[10px] mr-1 text-slate-500"></i>Detecting...</span>
      </div>

      <!-- Sync / Reload Gist Tasks Button -->
      <button onclick="loadTasksFromUrl(true)" title="Sync Tasks from Gist" class="bg-slate-900 border border-slate-800 hover:border-slate-700 text-slate-300 hover:text-amber-400 w-10 h-10 rounded-xl flex items-center justify-center transition">
        <i id="syncIcon" class="fa-solid fa-arrows-rotate text-sm"></i>
      </button>

      <!-- Task Sync Configuration Button -->
      <button onclick="openTaskModal()" title="Task Sync Settings" class="bg-slate-900 border border-slate-800 hover:border-slate-700 text-slate-300 hover:text-amber-400 w-10 h-10 rounded-xl flex items-center justify-center transition">
        <i class="fa-solid fa-gear text-sm"></i>
      </button>
    </div>
  </header>

  <!-- Main Content Layout Split: Hero Clock/Timer Top + 3 Column Tasks Bottom -->
  <main class="flex-1 flex flex-col justify-between p-6 space-y-4">

    <!-- Top Half: Enormous Display for Clock/Timer -->
    <section class="bg-slate-900/40 rounded-2xl border border-slate-800/80 p-6 flex flex-col items-center justify-center relative shadow-2xl min-h-[220px]">
      
      <!-- MODE 1: GYM WALL CLOCK DISPLAY -->
      <div id="clockDisplaySection" class="flex flex-col items-center justify-center space-y-1">
        <div id="clockDigits" class="digital-font text-7xl sm:text-8xl md:text-9xl font-black text-slate-100 tracking-tight leading-none drop-shadow-[0_0_25px_rgba(245,158,11,0.15)] cursor-pointer" onclick="toggleTimeFormat()" title="Click to toggle 12H / 24H">
          00:00:00
        </div>
        <div class="flex items-center space-x-3 text-slate-400 text-xs font-semibold uppercase tracking-widest pt-2">
          <span id="clockAmPm" class="text-amber-400 font-bold">--</span>
          <span>•</span>
          <span id="clockDate">--- --, ----</span>
        </div>
      </div>

      <!-- MODE 2: DEAD HANG STOPWATCH DISPLAY -->
      <div id="timerDisplaySection" class="hidden flex-col items-center justify-center space-y-4 w-full">
        
        <!-- Countdown Banner Overlay -->
        <div id="countdownBanner" class="hidden bg-amber-500/10 border border-amber-500/30 text-amber-400 px-6 py-1.5 rounded-full text-xs font
