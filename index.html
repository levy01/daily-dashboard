<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Daily Dashboard</title>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="Daily Dashboard">
<meta name="mobile-web-app-capable" content="yes">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  :root { --clock: #ff2a1a; --glow: rgba(255, 42, 26, 0.35); --tf: 4.4vw; }
  html, body { background: #000; color: #f2f2f2; -webkit-text-size-adjust: 100%; touch-action: manipulation;
    -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent; }
  body { font-family: -apple-system, "Helvetica Neue", Helvetica, Arial, sans-serif; padding: 2vw 3vw 6vw; min-height: 100%; }
  button, input { font-family: inherit; border: 0; outline: 0; -webkit-appearance: none; appearance: none; color: inherit; }
  ::-webkit-scrollbar { display: none; }

  /* ---------- big display ---------- */
  #clock { text-align: center; white-space: nowrap; font-size: 18vw; line-height: 1; font-weight: 300; letter-spacing: -0.02em;
    font-variant-numeric: tabular-nums; -webkit-font-feature-settings: "tnum"; font-feature-settings: "tnum";
    color: var(--clock); text-shadow: 0 0 2.5vw var(--glow); -webkit-user-select: none; user-select: none; }
  #clock .sub { font-size: 0.16em; letter-spacing: 0; margin-left: 0.15em; opacity: 0.55; font-weight: 400; text-shadow: none; }
  #clock.sw-pause, #clock.sw-cd { color: #ffb84d; text-shadow: 0 0 2.5vw rgba(255, 184, 77, 0.3); }

  #tools { position: static; z-index: 5; display: flex; justify-content: flex-end; margin-bottom: 1vw; }
  #tools button { width: 44px; height: 44px; border-radius: 22px; background: #151517; color: #aaa; font-size: 20px; margin-left: 8px; opacity: 0.5; }
  #tools button.on { background: #34343a; color: #fff; opacity: 1; }

  /* ---------- stopwatch controls ---------- */
  #controls { display: none; justify-content: center; align-items: center; margin-top: 1.4vw; }
  body.sw #controls { display: flex; }
  #controls button { font-size: 5vw; font-weight: 600; padding: 1.8vw 5vw; border-radius: 2vw; margin: 0 1.2vw; min-width: 30vw; }
  #controls small { font-size: 0.55em; font-weight: 400; opacity: 0.75; margin-left: 0.4em; }
  #btnMain { background: #1f9d6b; color: #fff; }
  #btnMain.stop { background: #c0392b; }
  #btnMain.cancel { background: #55555a; }
  #btnReset { background: #2a2a2e; color: #d0d0d4; }
  #btnReset.off { opacity: 0.35; }
  #controls button:active { opacity: 0.7; }

  /* ---------- edit bar ---------- */
  .edit-only { display: none; }
  body.edit .edit-only { display: flex; }
  #editbar { align-items: center; margin-top: 2vw; font-size: 3.4vw; color: #8a8a8e; flex-wrap: wrap; }
  #editbar button { background: #1b1b1e; color: #bbb; padding: 1.2vw 3vw; border-radius: 1.4vw; margin: 0 1vw 0 1.2vw; font-size: 1em; }
  #editbar button.on { background: #34343a; color: #fff; }
  #editbar .hint { font-size: 0.8em; margin-left: 1vw; }

  /* ---------- task columns ---------- */
  #lists { margin-top: 3vw; border-top: 1px solid #2a2a2e; padding-top: 2.4vw; }
  .col { --accent: #4da3ff; display: flex; flex-direction: column; min-width: 0; margin-bottom: 6vw; }
  .c1 { --accent: #3ddc97; } .c2 { --accent: #ffb84d; } .c3 { --accent: #c792ea; }
  .colhead { display: flex; align-items: baseline; justify-content: space-between; margin-bottom: 1.4vw; }
  .colhead h2 { font-size: 4vw; letter-spacing: 0.14em; text-transform: uppercase; font-weight: 700; color: var(--accent); }
  .cnt { font-size: 3.2vw; color: #6b6b70; white-space: nowrap; }
  .cnt b { color: #ff6b5e; font-weight: 700; }
  .tasks { min-height: 0; }
  .task { display: flex; align-items: flex-start; padding: 0.55em 0.2em 0.55em 0; border-bottom: 1px solid #141416; font-size: var(--tf);
    line-height: 1.25; cursor: pointer; min-height: 44px; -webkit-user-select: none; user-select: none; }
  .task:active { background: rgba(255, 255, 255, 0.05); }
  .dot { flex: 0 0 auto; width: 0.62em; height: 0.62em; border: 2px solid var(--accent); border-radius: 50%; margin: 0.32em 0.6em 0 0; opacity: 0.8; }
  .txt { flex: 1 1 0; min-width: 0; word-wrap: break-word; overflow-wrap: break-word; }
  .task.done .txt { text-decoration: line-through; color: #5c5c61; }
  .task.done .dot { background: var(--accent); }
  .task.queued { opacity: 0.45; cursor: default; }
  .badge { flex: 0 0 auto; margin-left: 0.5em; font-size: 0.62em; font-weight: 700; padding: 0.12em 0.55em; border-radius: 1em; align-self: flex-start; margin-top: 0.25em; }
  .age1 .badge { background: #4a3a00; color: #ffd27a; }
  .age2 .badge { background: #6a3200; color: #ffab66; }
  .age3 .badge { background: #8a1c14; color: #fff; }
  .age3 .txt { color: #ff9d94; }
  .badge.q { background: #1d1d22; color: #8a8a8e; }
  .tbtn { flex: 0 0 auto; width: 44px; height: 44px; margin: -0.5em 0 -0.5em 0.2em; background: transparent; color: #8a8a8e; font-size: 20px; }
  .tbtn.del { color: #c0574a; }
  .empty { color: #4a4a4f; font-size: calc(var(--tf) * 0.85); padding: 0.4em 0; }
  .addrow { margin-top: 1.6vw; }
  .addrow input { flex: 1 1 auto; min-width: 0; background: #101012; border: 1px solid #26262a; border-radius: 1.4vw; padding: 2vw 2.4vw; font-size: 4vw; -webkit-user-select: text; user-select: text; }
  .addrow button { flex: 0 0 auto; background: #2d6cdf; color: #fff; border-radius: 1.4vw; padding: 0 4vw; margin-left: 1.4vw; font-size: 4vw; font-weight: 600; }
  .notice { padding: 6vw 2vw; color: #8a8a8e; font-size: 4vw; text-align: center; line-height: 1.5; }

  /* ---------- footer ---------- */
  #foot { display: flex; flex-wrap: wrap; align-items: center; justify-content: center; border-top: 1px solid #2a2a2e; padding-top: 2vw; }
  #date { font-size: 5vw; font-weight: 300; width: 100%; text-align: center; margin-bottom: 2vw; }
  #modeSwitch { display: inline-block; background: #161618; border-radius: 2vw; padding: 0.6vw; }
  #modeSwitch button { background: transparent; color: #7a7a80; font-size: 3.6vw; padding: 1.6vw 3.4vw; border-radius: 1.6vw; }
  #modeSwitch button.on { background: #34343a; color: #fff; }
  #footR { text-align: center; line-height: 1.15; width: 100%; margin-top: 2vw; }
  #wx { font-size: 5vw; font-weight: 300; }
  #wx .hl { font-size: 0.62em; color: #8a8a8e; margin-left: 0.4em; }
  #status { font-size: 3vw; color: #4a4a50; margin-top: 0.6vw; }
  #status.err { color: #d4694a; }

  /* ---------- overlays ---------- */
  #dim { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: #000; opacity: 0; pointer-events: none; z-index: 20; transition: opacity 1.5s; }
  #dim.on { opacity: 0.62; }
  #modal { display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0, 0, 0, 0.82); z-index: 30; align-items: center; justify-content: center; padding: 4vw; }
  #modal.open { display: flex; }
  #modal .box { background: #151518; border: 1px solid #2c2c31; border-radius: 16px; padding: 22px; width: 100%; max-width: 560px; }
  #modal h3 { font-size: 20px; margin-bottom: 14px; }
  #modal label { display: block; font-size: 13px; color: #8a8a8e; margin: 12px 0 5px; text-transform: uppercase; letter-spacing: 0.08em; }
  #modal input { width: 100%; background: #0c0c0e; border: 1px solid #2c2c31; border-radius: 10px; padding: 12px; font-size: 16px; -webkit-user-select: text; user-select: text; }
  #modal .row { display: flex; justify-content: flex-end; margin-top: 18px; }
  #modal .row button { padding: 12px 18px; border-radius: 10px; background: #26262b; color: #ddd; font-size: 16px; margin-left: 10px; }
  #modal .row button.primary { background: #2d6cdf; color: #fff; font-weight: 600; }
  #modal .row button.danger { background: #4a1f1b; color: #ff9d94; margin-right: auto; margin-left: 0; }
  #modal .info { font-size: 13px; color: #6b6b70; margin-top: 12px; line-height: 1.5; }

  /* ---------- timer ---------- */
  #clock.tm-break { color: #2bff6e; text-shadow: 0 0 2.5vw rgba(43, 255, 110, 0.3); }
  #tbar { display: none; flex-direction: column; align-items: center; margin-top: 1.4vw; }
  body.tm #tbar { display: flex; }
  #presets { display: flex; justify-content: center; margin-bottom: 1.4vw; }
  #presets button { background: #1b1b1e; color: #9a9aa0; font-size: 3.6vw; padding: 1.4vw 3.2vw; border-radius: 1.6vw; margin: 0 0.8vw; }
  #presets button.on { background: #34343a; color: #fff; }
  #presets small { display: block; font-size: 0.7em; opacity: 0.7; }
  #tcontrols { display: flex; justify-content: center; }
  #tcontrols button { font-size: 5vw; font-weight: 600; padding: 1.8vw 5vw; border-radius: 2vw; margin: 0 1.2vw; min-width: 30vw; }
  #tcontrols button:active { opacity: 0.7; }
  #tMain { background: #1f9d6b; color: #fff; }
  #tMain.stop { background: #c0392b; }
  #tReset { background: #2a2a2e; color: #d0d0d4; }
  #pomo { font-size: 3vw; color: #6b6b70; margin-top: 1vw; }

  /* ---------- popups (forecast, news) + clickable footer ---------- */
  #wx, #date { cursor: pointer; }
  #pop { display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0, 0, 0, 0.82); z-index: 30; align-items: center; justify-content: center; padding: 4vw; }
  #pop.open { display: flex; }
  #pop .box { background: #151518; border: 1px solid #2c2c31; border-radius: 16px; padding: 22px; width: 100%; max-width: 640px; max-height: 88%; overflow-y: auto; -webkit-overflow-scrolling: touch; }
  #pop h3 { font-size: 20px; margin-bottom: 14px; }
  #pop .row { display: flex; justify-content: flex-end; margin-top: 16px; }
  #pop .row button { padding: 12px 18px; border-radius: 10px; background: #26262b; color: #ddd; font-size: 16px; }
  #pop .info { font-size: 14px; color: #8a8a8e; line-height: 1.5; padding: 6px 0; }
  .fc-row { display: flex; align-items: center; padding: 10px 0; border-bottom: 1px solid #222; font-size: 18px; }
  .fc-day { width: 100px; color: #aaa; }
  .fc-ic { width: 50px; font-size: 26px; }
  .fc-t { flex: 1 1 auto; }
  .fc-t span { color: #8a8a8e; margin-left: 8px; }
  .fc-p { color: #6fb7ff; width: 70px; text-align: right; font-size: 15px; }
  .ntabs { display: flex; flex-wrap: wrap; margin-bottom: 8px; }
  .ntabs button { background: #1b1b1e; color: #9a9aa0; padding: 8px 12px; border-radius: 10px; margin: 0 6px 6px 0; font-size: 14px; text-transform: capitalize; }
  .ntabs button.on { background: #34343a; color: #fff; }
  a.nitem { display: block; padding: 10px 0; border-bottom: 1px solid #222; color: #eee; text-decoration: none; font-size: 16px; line-height: 1.35; }
  a.nitem small { display: block; color: #7a7a80; margin-top: 3px; font-size: 12px; }
  .colhead h2 { -webkit-user-select: none; user-select: none; }
  body.edit .colhead h2 { cursor: pointer; border-bottom: 1px dashed currentColor; }
  .colhead .secdel { width: 36px; height: 36px; margin: 0 0 0 6px; }

  /* ---------- kiosk layout: tablet landscape / laptop ---------- */
  @media (min-width: 821px) {
    html, body { overflow: hidden; height: 100%; }
    :root { --tf: min(2.35vw, 30px); }
    body { position: fixed; top: 0; left: 0; right: 0; bottom: 0; display: flex; flex-direction: column; padding: 1.2vw 2.4vw 1vw; }
    #clock { font-size: 19.5vw; flex: 0 0 auto; }
    #tools { position: absolute; top: 12px; right: 16px; margin-bottom: 0; }
    #controls { margin-top: 0.8vw; flex: 0 0 auto; }
    #controls button { font-size: 3vw; padding: 1.1vw 4.5vw; border-radius: 1.4vw; min-width: 21vw; }
    #editbar { margin-top: 1vw; font-size: 1.8vw; flex: 0 0 auto; }
    #editbar button { padding: 0.6vw 1.6vw; border-radius: 1vw; margin: 0 0.6vw 0 0.8vw; }
    #lists { flex: 1 1 auto; min-height: 0; display: flex; margin-top: 1.4vw; padding-top: 1.2vw; }
    .col { flex: 1 1 0; padding: 0 1.6vw; border-left: 1px solid #1c1c1f; margin-bottom: 0; min-height: 0; overflow: hidden; }
    .col:first-child { border-left: 0; padding-left: 0; }
    .colhead { margin-bottom: 0.8vw; flex: 0 0 auto; }
    .colhead h2 { font-size: 2vw; }
    .cnt { font-size: 1.5vw; }
    .tasks { flex: 1 1 auto; overflow-y: auto; -webkit-overflow-scrolling: touch; }
    /* narrow columns: edit/delete buttons drop to their own line instead of squeezing the text */
    .task { flex-wrap: wrap; }
    .task > .edit-only { flex: 0 0 100%; justify-content: flex-end; margin-top: -0.2em; }
    .tbtn { height: 36px; margin: 0 0 0 10px; }
    .addrow { flex: 0 0 auto; margin-top: 0.8vw; }
    .addrow input { font-size: 1.8vw; padding: 0.9vw 1.2vw; border-radius: 1vw; }
    .addrow button { font-size: 1.8vw; padding: 0 2vw; margin-left: 0.8vw; border-radius: 1vw; }
    .notice { font-size: 2vw; width: 100%; }
    #foot { flex: 0 0 auto; flex-wrap: nowrap; padding-top: 1vw; justify-content: space-between; }
    #date { order: 2; width: auto; font-size: 3.2vw; margin-bottom: 0; letter-spacing: 0.01em; }
    #modeSwitch { order: 1; flex: 1 1 0; background: transparent; padding: 0; text-align: left; }
    #modeSwitch .pill { display: inline-block; background: #161618; border-radius: 1.2vw; padding: 0.3vw; }
    #modeSwitch button { font-size: 1.9vw; padding: 0.8vw 1.6vw; border-radius: 1vw; }
    #footR { order: 3; flex: 1 1 0; text-align: right; width: auto; margin-top: 0; }
    #wx { font-size: 2.8vw; }
    #status { font-size: max(1.1vw, 11px); margin-top: 0.2vw; }
    #modeSwitch.wrap { display: block; }
    #tbar { margin-top: 0.8vw; flex: 0 0 auto; }
    #presets { margin-bottom: 0.8vw; }
    #presets button { font-size: 1.9vw; padding: 0.7vw 1.8vw; border-radius: 1vw; margin: 0 0.5vw; }
    #tcontrols button { font-size: 3vw; padding: 1.1vw 4.5vw; border-radius: 1.4vw; min-width: 21vw; }
    #pomo { font-size: 1.5vw; margin-top: 0.5vw; }
  }
</style>
</head>
<body>
  <div id="tools">
    <button id="btnEdit" type="button" title="Add / edit tasks">&#9998;</button>
    <button id="btnGear" type="button" title="Connection">&#9881;</button>
  </div>

  <div id="clock">--:--:--</div>

  <div id="controls">
    <button id="btnMain" type="button">Start</button>
    <button id="btnReset" type="button" class="off">Reset</button>
  </div>

  <div id="tbar">
    <div id="presets"></div>
    <div id="tcontrols">
      <button id="tMain" type="button">Start</button>
      <button id="tReset" type="button">Reset</button>
    </div>
    <div id="pomo"></div>
  </div>

  <div id="editbar" class="edit-only">
    <button id="btnAddSec" type="button">+ Section</button>
    <span>Add to</span>
    <button id="dayToday" type="button" data-day="today">Today</button>
    <button id="dayTomorrow" type="button" data-day="tomorrow">Tomorrow</button>
    <span class="hint">tap a task to check it off &middot; &#9998; edit &middot; &#10005; delete</span>
  </div>

  <div id="lists"></div>

  <div id="foot">
    <div id="modeSwitch"><div class="pill">
      <button id="modeClock" type="button" class="on">Clock</button><button id="modeSw" type="button">Stopwatch</button><button id="modeTm" type="button">Timer</button>
    </div></div>
    <div id="date"></div>
    <div id="footR">
      <div id="wx"></div>
      <div id="status"></div>
    </div>
  </div>

  <div id="dim"></div>

  <div id="pop">
    <div class="box">
      <h3 id="popTitle"></h3>
      <div id="popBody"></div>
      <div class="row"><button id="popClose" type="button">Close</button></div>
    </div>
  </div>

  <div id="modal">
    <div class="box">
      <h3>Connect this device</h3>
      <label for="inApi">API URL</label>
      <input id="inApi" type="url" autocapitalize="off" autocorrect="off" placeholder="https://script.google.com/macros/s/.../exec">
      <label for="inKey">Key</label>
      <input id="inKey" type="text" autocapitalize="off" autocorrect="off" placeholder="48-character key">
      <div class="info" id="modalInfo"></div>
      <div class="row">
        <button id="mForget" type="button" class="danger">Forget</button>
        <button id="mClose" type="button">Close</button>
        <button id="mSave" type="button" class="primary">Save &amp; sync</button>
      </div>
    </div>
  </div>

<script>
(function () {
  'use strict';

  // ---------- storage helpers ----------
  function lsGet(k) { try { return window.localStorage.getItem(k); } catch (e) { return null; } }
  function lsSet(k, v) { try { window.localStorage.setItem(k, v); } catch (e) {} }
  function lsDel(k) { try { window.localStorage.removeItem(k); } catch (e) {} }
  function jget(k, def) { try { var s = lsGet(k); return s ? JSON.parse(s) : def; } catch (e) { return def; } }

  // ---------- constants ----------
  var POLL_MS = 45000;
  var WEATHER_MS = 20 * 60 * 1000;
  var STALE_MS = 3 * 60 * 1000;
  var DAYS = ['Sunday', 'Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday'];
  var MONTHS = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
  var COLORS = {
    red: ['#ff2a1a', 'rgba(255,42,26,0.35)'], green: ['#2bff6e', 'rgba(43,255,110,0.3)'],
    cyan: ['#19d3ff', 'rgba(25,211,255,0.3)'], amber: ['#ffb84d', 'rgba(255,184,77,0.3)'],
    purple: ['#c792ea', 'rgba(199,146,234,0.3)'], white: ['#f2f2f2', 'rgba(242,242,242,0.25)']
  };
  var DEFAULT_SETTINGS = {
    sections: ['Work', 'FinTech', 'Personal'], color: 'red', clock24h: false, countdown: 5,
    lat: 25.7617, lon: -80.1918, unit: 'fahrenheit', dim_start: '22:00', dim_end: '06:00',
    reload_at: '03:00', evening_hour: 17, pomodoro_min: 25, short_min: 5, long_min: 15, news_topics: []
  };

  function $(id) { return document.getElementById(id); }
  function pad(n) { return n < 10 ? '0' + n : '' + n; }
  function esc(s) { return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;'); }
  function hhmm(ms) { var d = new Date(ms); return pad(d.getHours()) + ':' + pad(d.getMinutes()); }

  // local calendar-day helpers (strings 'YYYY-MM-DD')
  function ymd(d) { return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()); }
  function todayStr() { return ymd(new Date()); }
  function addDays(s, n) { var p = s.split('-'); return new Date(Date.UTC(+p[0], +p[1] - 1, +p[2] + n)).toISOString().slice(0, 10); }
  function daysBetween(a, b) {
    var pa = a.split('-'), pb = b.split('-');
    return Math.round((Date.UTC(+pb[0], +pb[1] - 1, +pb[2]) - Date.UTC(+pa[0], +pa[1] - 1, +pa[2])) / 86400000);
  }

  // ---------- state ----------
  var cfg = { api: lsGet('dash_api') || '', key: lsGet('dash_key') || '' };
  var settings = {};
  (function () { var s = jget('dash_settings', {}); for (var k in DEFAULT_SETTINGS) settings[k] = (s[k] !== undefined ? s[k] : DEFAULT_SETTINGS[k]); })();
  var cache = jget('dash_cache', null);
  var serverTasks = cache && cache.tasks ? cache.tasks : [];
  var lastOk = cache && cache.at ? cache.at : 0;
  var lastErr = '';
  var queue = jget('dash_queue', []);
  var editMode = false;
  var addDay = 'today';
  var syncing = false, again = false;

  // ---------- one-tap pairing via #api=...&key=... ----------
  (function () {
    var h = window.location.hash;
    if (!h || h.length < 2) return;
    var m = {};
    h.slice(1).split('&').forEach(function (kv) { var i = kv.indexOf('='); if (i > 0) m[kv.slice(0, i)] = decodeURIComponent(kv.slice(i + 1)); });
    if (m.api && m.key) {
      cfg.api = m.api; cfg.key = m.key; lsSet('dash_api', cfg.api); lsSet('dash_key', cfg.key);
      try { window.history.replaceState(null, '', window.location.pathname + window.location.search); } catch (e) {}
    }
  })();

  // ---------- audio (one shared context, unlocked by a tap) ----------
  var audioCtx = null;
  function unlockAudio() {
    try {
      var AC = window.AudioContext || window.webkitAudioContext;
      if (!audioCtx && AC) audioCtx = new AC();
      if (audioCtx && audioCtx.state !== 'running') audioCtx.resume();
    } catch (e) {}
  }
  function beep(freq, dur) {
    if (!audioCtx) return;
    try {
      var o = audioCtx.createOscillator(), g = audioCtx.createGain();
      o.type = 'sine'; o.frequency.value = freq; g.gain.value = 0.25;
      o.connect(g); g.connect(audioCtx.destination);
      o.start(); o.stop(audioCtx.currentTime + dur);
    } catch (e) {}
  }

  // =====================================================================
  //  Clock + stopwatch
  // =====================================================================
  var clockEl = $('clock'), dateEl = $('date');
  var lastDisp = '', lastCls = '', lastDate = '', lastMainLabel = '';
  var mode = 'clock';
  var sw = { state: 'idle', start: 0, acc: 0, cdEnd: 0, lastCd: -1 };  // idle | countdown | running | paused

  function swElapsed() { return sw.state === 'running' ? sw.acc + (Date.now() - sw.start) : sw.acc; }
  function setDisp(html, cls) {
    if (html !== lastDisp) { lastDisp = html; clockEl.innerHTML = html; }
    if (cls !== lastCls) { lastCls = cls; clockEl.className = cls; }
  }

  function tick() {
    var now = Date.now();
    if (sw.state === 'countdown') {
      var rem = Math.ceil((sw.cdEnd - now) / 1000);
      if (rem <= 0) { sw.state = 'running'; sw.start = sw.cdEnd; sw.acc = 0; sw.lastCd = -1; beep(1320, 0.6); syncButtons(); }
      else if (rem !== sw.lastCd) { sw.lastCd = rem; if (rem <= 3) beep(880, 0.15); }
    }
    if (tm.state === 'running' && now >= tm.end) timerDone();
    if (mode === 'sw') {
      if (sw.state === 'countdown') {
        setDisp('' + Math.max(1, Math.ceil((sw.cdEnd - now) / 1000)), 'sw-cd');
      } else {
        var ms = swElapsed(), tot = Math.floor(ms / 1000);
        var t = pad(Math.floor(tot / 3600)) + ':' + pad(Math.floor(tot / 60) % 60) + ':' + pad(tot % 60);
        setDisp(t + '<span class="sub">.' + Math.floor((ms % 1000) / 100) + '</span>', sw.state === 'paused' ? 'sw-pause' : '');
      }
    } else if (mode === 'timer') {
      var tsec = Math.ceil((tm.state === 'idle' ? presetMs(tm.preset) : tmRemaining()) / 1000);
      setDisp(pad(Math.floor(tsec / 60)) + ':' + pad(tsec % 60), tm.state === 'paused' ? 'sw-pause' : (tm.preset === 'pomo' ? '' : 'tm-break'));
    } else {
      var d = new Date(now), h = d.getHours(), suffix = '';
      if (!settings.clock24h) { suffix = h >= 12 ? 'PM' : 'AM'; h = h % 12; if (h === 0) h = 12; }
      setDisp(pad(h) + ':' + pad(d.getMinutes()) + ':' + pad(d.getSeconds()) + (suffix ? '<span class="sub">' + suffix + '</span>' : ''), '');
    }
    var dd = new Date(now);
    var ds = DAYS[dd.getDay()] + ', ' + MONTHS[dd.getMonth()] + ' ' + dd.getDate() + ' ' + dd.getFullYear();
    if (ds !== lastDate) { lastDate = ds; dateEl.textContent = ds; }
  }

  function syncButtons() {
    var label, cls = '';
    if (sw.state === 'idle') label = 'Start<small>' + settings.countdown + 's delay</small>';
    else if (sw.state === 'countdown') { label = 'Cancel'; cls = 'cancel'; }
    else if (sw.state === 'running') { label = 'Stop'; cls = 'stop'; }
    else label = 'Resume';
    if (label !== lastMainLabel) { lastMainLabel = label; $('btnMain').innerHTML = label; }
    $('btnMain').className = cls;
    $('btnReset').className = sw.state === 'idle' ? 'off' : '';
  }

  function bodyCls() { return (mode === 'sw' ? 'sw ' : '') + (mode === 'timer' ? 'tm ' : '') + (editMode ? 'edit' : ''); }
  function setMode(m) {
    mode = m;
    document.body.className = bodyCls();
    $('modeClock').className = m === 'clock' ? 'on' : '';
    $('modeSw').className = m === 'sw' ? 'on' : '';
    $('modeTm').className = m === 'timer' ? 'on' : '';
    if (m === 'timer') timerButtons();
    lastDisp = ''; tick();
  }

  $('btnMain').addEventListener('click', function () {
    unlockAudio();
    var now = Date.now();
    if (sw.state === 'idle') {
      if (settings.countdown > 0) { sw.state = 'countdown'; sw.cdEnd = now + settings.countdown * 1000; sw.lastCd = -1; sw.acc = 0; }
      else { sw.state = 'running'; sw.start = now; sw.acc = 0; }
    }
    else if (sw.state === 'countdown') { sw.state = 'idle'; sw.acc = 0; }
    else if (sw.state === 'running') { sw.acc = swElapsed(); sw.state = 'paused'; }
    else if (sw.state === 'paused') { sw.start = now; sw.state = 'running'; }
    syncButtons(); tick();
  });
  $('btnReset').addEventListener('click', function () { sw.state = 'idle'; sw.acc = 0; sw.lastCd = -1; syncButtons(); tick(); });
  $('modeClock').addEventListener('click', function () { setMode('clock'); });
  $('modeSw').addEventListener('click', function () { unlockAudio(); setMode('sw'); });
  $('modeTm').addEventListener('click', function () { unlockAudio(); setMode('timer'); });

  // =====================================================================
  //  Countdown timer: Pomodoro / Short Break / Long Break
  // =====================================================================
  var PRESETS = {
    pomo: { label: 'Pomodoro', key: 'pomodoro_min' },
    short: { label: 'Short Break', key: 'short_min' },
    long: { label: 'Long Break', key: 'long_min' }
  };
  var tm = { state: 'idle', preset: 'pomo', end: 0, rem: 0 };   // idle | running | paused
  var pomo = jget('dash_pomo', { day: '', n: 0 });

  function presetMs(p) {
    var m = parseFloat(settings[PRESETS[p].key]);
    if (!(m > 0)) m = DEFAULT_SETTINGS[PRESETS[p].key];
    return Math.round(m * 60000);
  }
  function tmRemaining() { return tm.state === 'running' ? Math.max(0, tm.end - Date.now()) : tm.rem; }
  function pomoCount() { if (pomo.day !== todayStr()) pomo = { day: todayStr(), n: 0 }; return pomo.n; }

  function timerButtons() {
    var html = '';
    ['pomo', 'short', 'long'].forEach(function (p) {
      html += '<button type="button" data-p="' + p + '"' + (tm.preset === p ? ' class="on"' : '') + '>' + PRESETS[p].label +
        '<small>' + Math.round(presetMs(p) / 60000) + ' min</small></button>';
    });
    if ($('presets').getAttribute('data-sig') !== html) { $('presets').setAttribute('data-sig', html); $('presets').innerHTML = html; }
    $('tMain').textContent = tm.state === 'running' ? 'Pause' : (tm.state === 'paused' ? 'Resume' : 'Start');
    $('tMain').className = tm.state === 'running' ? 'stop' : '';
    $('pomo').textContent = 'Pomodoros today: ' + pomoCount();
    lastDisp = '';
  }

  function timerDone() {
    tm.state = 'idle';
    beep(880, 0.25); setTimeout(function () { beep(880, 0.25); }, 400); setTimeout(function () { beep(1320, 0.7); }, 800);
    if (tm.preset === 'pomo') {
      pomoCount(); pomo.n++; lsSet('dash_pomo', JSON.stringify(pomo));
      tm.preset = (pomo.n % 4 === 0) ? 'long' : 'short';      // long break after every 4th pomodoro
    } else tm.preset = 'pomo';
    timerButtons();
  }

  $('tMain').addEventListener('click', function () {
    unlockAudio();
    var now = Date.now();
    if (tm.state === 'idle') { tm.end = now + presetMs(tm.preset); tm.state = 'running'; }
    else if (tm.state === 'running') { tm.rem = tmRemaining(); tm.state = 'paused'; }
    else { tm.end = now + tm.rem; tm.state = 'running'; }
    timerButtons(); tick();
  });
  $('tReset').addEventListener('click', function () { tm.state = 'idle'; timerButtons(); tick(); });
  $('presets').addEventListener('click', function (e) {
    var b = e.target.closest ? e.target.closest('[data-p]') : null;
    if (!b) return;
    if (tm.state !== 'idle' && !window.confirm('Stop the current timer?')) return;
    tm.preset = b.getAttribute('data-p'); tm.state = 'idle';
    timerButtons(); tick();
  });

  // =====================================================================
  //  Tasks: local view = last server copy + pending ops (optimistic)
  // =====================================================================
  var listsEl = $('lists');
  var sectionSig = '';

  function newId() { return (Date.now().toString(36) + Math.random().toString(36).slice(2, 8)).slice(0, 20); }
  function saveQueue() { lsSet('dash_queue', JSON.stringify(queue)); }
  function enqueue(op) { queue.push(op); saveQueue(); renderTasks(); renderStatus(); sync(); }

  function applyOp(map, order, op) {
    var t = map[op.id];
    if (op.op === 'add') {
      if (!t) { map[op.id] = { id: op.id, section: op.section, text: op.text, day: op.day, done: '' }; order.push(op.id); }
    } else if (!t) { return; }
    else if (op.op === 'done') { t.done = op.done || ''; }
    else if (op.op === 'del') { delete map[op.id]; }
    else if (op.op === 'edit') { if (op.text) t.text = op.text; if (op.section) t.section = op.section; if (op.day) t.day = op.day; }
  }

  function viewTasks() {
    var map = {}, order = [];
    serverTasks.forEach(function (t) { map[t.id] = { id: t.id, section: t.section, text: t.text, day: t.day, done: t.done || '' }; order.push(t.id); });
    queue.forEach(function (op) {
      if (op.op === 'secRename') {
        for (var id in map) if (String(map[id].section).toLowerCase() === String(op.from).toLowerCase()) map[id].section = op.to;
        return;
      }
      if (op.op === 'secAdd' || op.op === 'secDel') return;
      applyOp(map, order, op);
    });
    return order.filter(function (id) { return map[id]; }).map(function (id) { return map[id]; });
  }

  // section names = server list + not-yet-synced rename/add/remove ops
  function effSections() {
    var s = settings.sections.slice();
    function find(n) { for (var j = 0; j < s.length; j++) if (String(s[j]).toLowerCase() === String(n).toLowerCase()) return j; return -1; }
    queue.forEach(function (op) {
      var k;
      if (op.op === 'secRename') { k = find(op.from); if (k >= 0) s[k] = op.to; }
      else if (op.op === 'secAdd') { if (s.length < 4 && find(op.name) < 0) s.push(op.name); }
      else if (op.op === 'secDel') { k = find(op.name); if (k >= 0 && s.length > 1) s.splice(k, 1); }
    });
    return s;
  }

  function cleanSection(v) { return String(v || '').replace(/,/g, ' ').replace(/\s+/g, ' ').trim().slice(0, 30); }

  function sectionsFor(tasks) {
    var list = [], seen = {};
    effSections().forEach(function (n) { var k = String(n).toLowerCase(); if (!seen[k]) { seen[k] = 1; list.push({ key: k, name: n }); } });
    tasks.forEach(function (t) { var k = String(t.section || '').toLowerCase(); if (k && !seen[k] && list.length < 4) { seen[k] = 1; list.push({ key: k, name: t.section }); } });
    return list.slice(0, 4);
  }

  function buildColumns(cols) {
    var html = '';
    cols.forEach(function (c, i) {
      html += '<div class="col c' + i + '" data-key="' + esc(c.key) + '" data-name="' + esc(c.name) + '">' +
        '<div class="colhead"><h2>' + esc(c.name) + '</h2><span class="cnt"></span>' +
        (cols.length > 1 ? '<span class="edit-only"><button class="tbtn del secdel" type="button" data-act="secdel" title="Remove section">&#10005;</button></span>' : '') + '</div>' +
        '<div class="tasks"></div>' +
        '<div class="addrow edit-only"><input type="text" maxlength="200" placeholder="Add to ' + esc(c.name) + '&hellip;" autocapitalize="sentences"><button type="button" data-act="add">Add</button></div>' +
        '</div>';
    });
    listsEl.innerHTML = html;
  }

  function renderTasks() {
    if (!cfg.api) {
      sectionSig = '';
      listsEl.innerHTML = '<div class="notice">Not connected yet.<br>Tap &#9881; and paste your API URL and key,<br>or open your pairing link on this device.</div>';
      return;
    }
    var tasks = viewTasks(), today = todayStr(), tomorrow = addDays(today, 1);
    var cols = sectionsFor(tasks);
    var sig = cols.map(function (c) { return c.key; }).join('|') + '#' + cols.map(function (c) { return c.name; }).join('|');
    if (sig !== sectionSig) { sectionSig = sig; buildColumns(cols); }

    var buckets = cols.map(function () { return { open: [], done: [], queued: [] }; });
    var queuedTotal = 0;
    tasks.forEach(function (t) {
      var k = String(t.section || '').toLowerCase(), ci = cols.length - 1, i;
      for (i = 0; i < cols.length; i++) { if (cols[i].key === k) { ci = i; break; } }
      if (t.day > today) { if (!t.done) { buckets[ci].queued.push(t); queuedTotal++; } }
      else if (t.done) { if (t.done === today) buckets[ci].done.push(t); }
      else buckets[ci].open.push(t);
    });
    queuedCount = queuedTotal;

    var colEls = listsEl.querySelectorAll('.col');
    cols.forEach(function (c, i) {
      var b = buckets[i], el = colEls[i]; if (!el) return;
      b.open.sort(function (x, y) { return x.day < y.day ? -1 : (x.day > y.day ? 1 : 0); });   // most overdue first
      var late = b.open.filter(function (t) { return daysBetween(t.day, today) >= 1; }).length;
      el.querySelector('.cnt').innerHTML = b.open.length + ' open' + (late ? ' &middot; <b>' + late + ' carried</b>' : '') + (b.done.length ? ' &middot; ' + b.done.length + ' done' : '');
      var html = '';
      function row(t, kind) {
        var age = Math.max(0, daysBetween(t.day, today));
        var cls = 'task' + (kind === 'done' ? ' done' : '') + (kind === 'queued' ? ' queued' : '') + (kind === 'open' && age >= 1 ? ' age' + Math.min(age, 3) : '');
        var badge = '';
        if (kind === 'open' && age >= 1) badge = '<span class="badge">' + age + 'd</span>';
        if (kind === 'queued') badge = '<span class="badge q">' + (t.day === tomorrow ? 'tomorrow' : t.day.slice(5)) + '</span>';
        var btns = '<span class="edit-only"><button class="tbtn" type="button" data-act="edit">&#9998;</button><button class="tbtn del" type="button" data-act="del">&#10005;</button></span>';
        return '<div class="' + cls + '" data-id="' + esc(t.id) + '"><span class="dot"></span><span class="txt">' + esc(t.text) + '</span>' + badge + btns + '</div>';
      }
      b.open.forEach(function (t) { html += row(t, 'open'); });
      b.done.forEach(function (t) { html += row(t, 'done'); });
      if (editMode) b.queued.forEach(function (t) { html += row(t, 'queued'); });
      if (!html) html = '<div class="empty">Nothing queued</div>';
      el.querySelector('.tasks').innerHTML = html;
    });
  }
  var queuedCount = 0;

  function findTask(id) { var a = viewTasks(); for (var i = 0; i < a.length; i++) if (a[i].id === id) return a[i]; return null; }

  function addTask(colEl) {
    var input = colEl.querySelector('input'), text = input.value.replace(/\s+/g, ' ').trim();
    if (!text) return;
    var day = addDay === 'tomorrow' ? addDays(todayStr(), 1) : todayStr();
    input.value = '';
    enqueue({ op: 'add', id: newId(), section: colEl.getAttribute('data-name'), text: text, day: day });
  }

  listsEl.addEventListener('click', function (e) {
    var btn = e.target.closest ? e.target.closest('[data-act]') : null;
    var row = e.target.closest ? e.target.closest('.task') : null;
    if (btn && btn.getAttribute('data-act') === 'add') { addTask(btn.closest('.col')); return; }
    if (btn && btn.getAttribute('data-act') === 'secdel') { removeSection(btn.closest('.col')); return; }
    var head = e.target.closest ? e.target.closest('.colhead h2') : null;
    if (head && editMode) { renameSection(head.closest('.col')); return; }
    if (!row) return;
    var id = row.getAttribute('data-id'), t = findTask(id);
    if (!t) return;
    var act = btn ? btn.getAttribute('data-act') : '';
    if (act === 'del') { if (window.confirm('Delete "' + t.text + '"?')) enqueue({ op: 'del', id: id }); return; }
    if (act === 'edit') {
      var nt = window.prompt('Edit task', t.text);
      if (nt !== null && nt.replace(/\s+/g, ' ').trim()) enqueue({ op: 'edit', id: id, text: nt.replace(/\s+/g, ' ').trim() });
      return;
    }
    if (row.className.indexOf('queued') >= 0) return;
    enqueue({ op: 'done', id: id, done: t.done ? '' : todayStr() });
  });
  function sectionTaken(name, exceptKey) {
    var k = name.toLowerCase(), s = effSections();
    for (var i = 0; i < s.length; i++) if (s[i].toLowerCase() === k && k !== exceptKey) return true;
    return false;
  }
  function renameSection(col) {
    var old = col.getAttribute('data-name'), key = col.getAttribute('data-key');
    var nn = window.prompt('Rename section "' + old + '" to:', old);
    if (nn === null) return;
    nn = cleanSection(nn);
    if (!nn || nn === old) return;
    if (sectionTaken(nn, key)) { window.alert('There is already a section called "' + nn + '".'); return; }
    enqueue({ op: 'secRename', id: newId(), from: old, to: nn });
  }
  function removeSection(col) {
    var name = col.getAttribute('data-name'), key = col.getAttribute('data-key'), n = 0;
    viewTasks().forEach(function (t) { if (String(t.section || '').toLowerCase() === key) n++; });
    if (n) { window.alert('"' + name + '" still has ' + n + ' task(s). Finish or delete them first (or just rename the section).'); return; }
    if (window.confirm('Remove the empty section "' + name + '"?')) enqueue({ op: 'secDel', id: newId(), name: name });
  }
  $('btnAddSec').addEventListener('click', function () {
    if (effSections().length >= 4) { window.alert('Four sections is the maximum.'); return; }
    var nn = window.prompt('New section name (e.g. Fitness, Groceries):', '');
    if (nn === null) return;
    nn = cleanSection(nn);
    if (!nn) return;
    if (sectionTaken(nn, '')) { window.alert('There is already a section called "' + nn + '".'); return; }
    enqueue({ op: 'secAdd', id: newId(), name: nn });
  });
  listsEl.addEventListener('keydown', function (e) {
    if ((e.key === 'Enter' || e.keyCode === 13) && e.target.tagName === 'INPUT') addTask(e.target.closest('.col'));
  });

  // edit mode + add-day selector
  function setEdit(on) {
    editMode = on;
    if (on) addDay = (new Date().getHours() >= settings.evening_hour) ? 'tomorrow' : 'today';
    document.body.className = bodyCls();
    $('btnEdit').className = on ? 'on' : '';
    $('dayToday').className = addDay === 'today' ? 'on' : '';
    $('dayTomorrow').className = addDay === 'tomorrow' ? 'on' : '';
    renderTasks();
  }
  $('btnEdit').addEventListener('click', function () { setEdit(!editMode); });
  $('dayToday').addEventListener('click', function () { addDay = 'today'; $('dayToday').className = 'on'; $('dayTomorrow').className = ''; });
  $('dayTomorrow').addEventListener('click', function () { addDay = 'tomorrow'; $('dayTomorrow').className = 'on'; $('dayToday').className = ''; });

  // =====================================================================
  //  Sync
  // =====================================================================
  function renderStatus() {
    var el = $('status'), txt = '', err = false;
    if (!cfg.api) { txt = 'not connected'; err = true; }
    else if (lastErr === 'auth') { txt = 'wrong key - tap the gear'; err = true; }
    else if (queue.length) { txt = 'pending ' + queue.length + (lastErr ? ' - ' + lastErr : ''); err = !!lastErr; }
    else if (!lastOk) { txt = lastErr || 'not synced yet'; err = true; }
    else if (Date.now() - lastOk > STALE_MS) { txt = 'stale - last sync ' + hhmm(lastOk); err = true; }
    else { txt = 'synced ' + hhmm(lastOk); }
    if (cfg.api && queuedCount) txt += ' · ' + queuedCount + ' queued for later';
    el.textContent = txt;
    el.className = err ? 'err' : '';
  }

  function applyRemoteSettings(s) {
    if (!s) return;
    var changed = JSON.stringify(s) !== JSON.stringify(jget('dash_settings', {}));
    for (var k in DEFAULT_SETTINGS) if (s[k] !== undefined && s[k] !== null && s[k] !== '') settings[k] = s[k];
    if (!(settings.sections instanceof Array) || !settings.sections.length) settings.sections = DEFAULT_SETTINGS.sections;
    lsSet('dash_settings', JSON.stringify(s));
    applyLook();
    if (changed) loadWeather();
  }

  function applyLook() {
    var c = COLORS[String(settings.color).toLowerCase()] || COLORS.red;
    document.documentElement.style.setProperty('--clock', c[0]);
    document.documentElement.style.setProperty('--glow', c[1]);
    lastMainLabel = ''; syncButtons();
  }

  function sync() {
    if (!cfg.api || !cfg.key) { renderStatus(); return; }
    if (syncing) { again = true; return; }
    syncing = true;
    var sent = queue.slice(), xhr = new XMLHttpRequest(), body = null;
    try {
      if (sent.length) {
        xhr.open('POST', cfg.api, true);
        xhr.setRequestHeader('Content-Type', 'text/plain;charset=utf-8');   // "simple" request: no CORS preflight
        body = JSON.stringify({ key: cfg.key, today: todayStr(), ops: sent });
      } else {
        xhr.open('GET', cfg.api + (cfg.api.indexOf('?') < 0 ? '?' : '&') + 'key=' + encodeURIComponent(cfg.key) + '&today=' + todayStr() + '&_=' + Date.now(), true);
      }
    } catch (e) { lastErr = 'bad URL'; finish(); return; }
    xhr.timeout = 25000;
    xhr.onload = function () {
      var j = null; try { j = JSON.parse(xhr.responseText); } catch (e) {}
      if (j && j.ok) {
        queue = queue.slice(sent.length); saveQueue();          // only the ops we actually delivered
        serverTasks = j.tasks || []; lastOk = Date.now(); lastErr = '';
        lsSet('dash_cache', JSON.stringify({ tasks: serverTasks, at: lastOk }));
        applyRemoteSettings(j.settings);
      } else { lastErr = (j && j.error) ? j.error : 'bad response'; }
      finish();
    };
    xhr.onerror = xhr.ontimeout = function () { lastErr = 'offline'; finish(); };
    xhr.send(body);
    function finish() { syncing = false; renderTasks(); renderStatus(); if (again) { again = false; setTimeout(sync, 200); } }
  }

  // connection modal
  function openModal() {
    $('inApi').value = cfg.api; $('inKey').value = cfg.key;
    $('modalInfo').textContent = queue.length + ' change(s) waiting to sync. Tip: you can also pair by opening this page with #api=...&key=... added to the address.';
    $('modal').className = 'open';
  }
  $('btnGear').addEventListener('click', openModal);
  $('mClose').addEventListener('click', function () { $('modal').className = ''; });
  $('mSave').addEventListener('click', function () {
    cfg.api = $('inApi').value.trim(); cfg.key = $('inKey').value.trim();
    lsSet('dash_api', cfg.api); lsSet('dash_key', cfg.key); lastErr = '';
    $('modal').className = ''; sectionSig = ''; renderTasks(); sync();
  });
  $('mForget').addEventListener('click', function () {
    cfg.api = ''; cfg.key = ''; lsDel('dash_api'); lsDel('dash_key'); lsDel('dash_cache'); lsDel('dash_queue');
    serverTasks = []; queue = []; lastOk = 0; lastErr = '';
    $('modal').className = ''; renderTasks(); renderStatus();
  });

  // =====================================================================
  //  Weather (Open-Meteo, coordinates come from the Settings tab)
  // =====================================================================
  function wxIcon(code, isDay) {
    if (code === 0) return isDay ? '☀️' : '🌙';
    if (code === 1) return isDay ? '🌤️' : '🌙';
    if (code === 2) return isDay ? '⛅' : '☁️';
    if (code === 3) return '☁️';
    if (code === 45 || code === 48) return '🌫️';
    if (code >= 51 && code <= 57) return '🌦️';
    if (code >= 61 && code <= 67) return '🌧️';
    if (code >= 71 && code <= 77) return '🌨️';
    if (code >= 80 && code <= 82) return '🌦️';
    if (code === 85 || code === 86) return '🌨️';
    if (code >= 95) return '⛈️';
    return '🌡️';
  }
  var wxOk = false;
  function showWeather(j) {
    try {
      var c = j.current, d = j.daily, html = wxIcon(c.weather_code, c.is_day === 1) + ' ' + Math.round(c.temperature_2m) + '°';
      if (d && d.temperature_2m_max) html += '<span class="hl">' + Math.round(d.temperature_2m_max[0]) + '° / ' + Math.round(d.temperature_2m_min[0]) + '°</span>';
      $('wx').innerHTML = html; wxOk = true;
    } catch (e) {}
  }
  function loadWeather() {
    var url = 'https://api.open-meteo.com/v1/forecast?latitude=' + settings.lat + '&longitude=' + settings.lon +
      '&current=temperature_2m,weather_code,is_day&daily=weather_code,temperature_2m_max,temperature_2m_min,precipitation_probability_max&temperature_unit=' + settings.unit + '&timezone=auto&forecast_days=5';
    var xhr = new XMLHttpRequest();
    try { xhr.open('GET', url, true); } catch (e) { return; }
    xhr.timeout = 15000;
    xhr.onload = function () {
      if (xhr.status >= 200 && xhr.status < 300) { try { showWeather(JSON.parse(xhr.responseText)); lsSet('dash_wx', xhr.responseText); } catch (e) {} }
      else if (!wxOk) $('wx').innerHTML = '<span class="hl">weather unavailable</span>';
    };
    xhr.onerror = xhr.ontimeout = function () { if (!wxOk) $('wx').innerHTML = '<span class="hl">weather unavailable</span>'; };
    xhr.send();
  }

  // =====================================================================
  //  Popups: 5-day forecast (tap weather) and top news (tap date)
  // =====================================================================
  function openPop(title, html) { $('popTitle').textContent = title; $('popBody').innerHTML = html; $('pop').className = 'open'; }
  function closePop() { $('pop').className = ''; }
  $('popClose').addEventListener('click', closePop);
  $('pop').addEventListener('click', function (e) { if (e.target === $('pop')) closePop(); });

  $('wx').addEventListener('click', function () {
    var j = null; try { j = JSON.parse(lsGet('dash_wx') || 'null'); } catch (e) {}
    if (!j || !j.daily || !j.daily.time) { openPop('Forecast', '<div class="info">Weather has not loaded yet.</div>'); return; }
    var d = j.daily, html = '';
    for (var i = 0; i < d.time.length; i++) {
      var p = d.time[i].split('-'), dow = DAYS[new Date(Date.UTC(+p[0], +p[1] - 1, +p[2])).getUTCDay()];
      var rain = d.precipitation_probability_max && d.precipitation_probability_max[i] !== null && d.precipitation_probability_max[i] !== undefined ? '&#128167; ' + d.precipitation_probability_max[i] + '%' : '';
      html += '<div class="fc-row"><div class="fc-day">' + (i === 0 ? 'Today' : dow) + '</div><div class="fc-ic">' + wxIcon(d.weather_code ? d.weather_code[i] : 0, true) + '</div>' +
        '<div class="fc-t">' + Math.round(d.temperature_2m_max[i]) + '°<span>' + Math.round(d.temperature_2m_min[i]) + '°</span></div><div class="fc-p">' + rain + '</div></div>';
    }
    openPop('Forecast', html);
  });

  var newsData = null, newsAt = 0, newsTab = 0;
  function ago(t) {
    if (!t) return '';
    var m = Math.round((Date.now() - t) / 60000);
    return m < 1 ? 'just now' : (m < 60 ? m + 'm ago' : (m < 1440 ? Math.round(m / 60) + 'h ago' : Math.round(m / 1440) + 'd ago'));
  }
  function renderNews(note) {
    var topics = (newsData && newsData.topics) || [];
    if (!topics.length) { openPop('Top news', '<div class="info">No topics set. Add a <b>news_topics</b> row (e.g. finance, health, sports) to the Settings tab.</div>'); return; }
    if (newsTab >= topics.length) newsTab = 0;
    var html = '<div class="ntabs">';
    topics.forEach(function (t, i) { html += '<button type="button" data-tab="' + i + '"' + (i === newsTab ? ' class="on"' : '') + '>' + esc(t.topic) + '</button>'; });
    html += '</div>';
    var items = topics[newsTab].items || [];
    if (!items.length) html += '<div class="info">' + (topics[newsTab].err ? 'News feed error: ' + esc(topics[newsTab].err) + '. In the Sheet, run Dashboard &gt; Test news feed.' : 'No stories found right now.') + '</div>';
    items.forEach(function (it) {
      if (!/^https?:\/\//i.test(it.link || '')) return;
      html += '<a class="nitem" target="_blank" rel="noopener" href="' + esc(it.link) + '">' + esc(it.title) + '<small>' + esc(it.source || '') + (it.t ? ' &middot; ' + ago(it.t) : '') + '</small></a>';
    });
    if (note) html += '<div class="info">' + esc(note) + '</div>';
    openPop('Top news', html);
  }
  $('popBody').addEventListener('click', function (e) {
    var b = e.target.closest ? e.target.closest('[data-tab]') : null;
    if (b && newsData) { newsTab = +b.getAttribute('data-tab'); renderNews(''); }
  });
  $('date').addEventListener('click', function () {
    if (!cfg.api || !cfg.key) { openPop('Top news', '<div class="info">Connect this device first (gear icon).</div>'); return; }
    if (newsData && Date.now() - newsAt < 10 * 60000) { renderNews(''); return; }
    openPop('Top news', '<div class="info">Loading&hellip;</div>');
    var xhr = new XMLHttpRequest();
    try { xhr.open('GET', cfg.api + (cfg.api.indexOf('?') < 0 ? '?' : '&') + 'key=' + encodeURIComponent(cfg.key) + '&action=news&_=' + Date.now(), true); }
    catch (e) { openPop('Top news', '<div class="info">Bad API URL.</div>'); return; }
    xhr.timeout = 30000;
    xhr.onload = function () {
      var j = null; try { j = JSON.parse(xhr.responseText); } catch (e) {}
      if (j && j.ok && j.topics) { newsData = j; newsAt = Date.now(); lsSet('dash_news', JSON.stringify(j)); renderNews(''); }
      else if (j && j.ok) openPop('Top news', '<div class="info">The Apps Script is an old version. Paste the new Code.gs and redeploy a new version.</div>');
      else openPop('Top news', '<div class="info">Could not load news (' + esc((j && j.error) || 'bad response') + ').</div>');
    };
    xhr.onerror = xhr.ontimeout = function () {
      var old = jget('dash_news', null);
      if (old && old.topics) { newsData = old; renderNews('Offline: showing the last saved headlines.'); }
      else openPop('Top news', '<div class="info">Offline. Try again when you are connected.</div>');
    };
    xhr.send();
  });

  // =====================================================================
  //  Kiosk housekeeping: night dim, nightly reload, wake-up sync
  // =====================================================================
  function hm(s) { var p = String(s || '').split(':'); return (+p[0]) * 60 + (+p[1] || 0); }
  function housekeeping() {
    var d = new Date(), m = d.getHours() * 60 + d.getMinutes(), a = hm(settings.dim_start), b = hm(settings.dim_end);
    var dim = (!isNaN(a) && !isNaN(b) && a !== b) ? (a < b ? (m >= a && m < b) : (m >= a || m < b)) : false;
    $('dim').className = dim ? 'on' : '';
    var r = hm(settings.reload_at);
    if (!isNaN(r) && m === r && lsGet('dash_reload') !== todayStr() && sw.state === 'idle' && tm.state === 'idle' && !editMode) {
      lsSet('dash_reload', todayStr());
      window.location.reload();
    }
  }
  document.addEventListener('visibilitychange', function () { if (!document.hidden) { sync(); } });
  window.addEventListener('online', sync);
  window.addEventListener('focus', sync);

  // ---------- boot ----------
  applyLook();
  var cachedWx = lsGet('dash_wx');
  if (cachedWx) { try { showWeather(JSON.parse(cachedWx)); } catch (e) {} }
  syncButtons();
  renderTasks();
  renderStatus();
  tick();
  setInterval(tick, 100);
  setInterval(renderStatus, 10000);
  setInterval(housekeeping, 20000);
  housekeeping();
  setInterval(sync, POLL_MS);
  setInterval(loadWeather, WEATHER_MS);
  loadWeather();
  sync();

  if ('serviceWorker' in navigator && window.location.protocol.indexOf('http') === 0) {
    window.addEventListener('load', function () { navigator.serviceWorker.register('sw.js').catch(function () {}); });
  }
})();
</script>
</body>
</html>
